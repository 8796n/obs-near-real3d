# near Real 3D (obs-near-real3d) -- UI 文字列（日本語）

# グループ
group.3d="3D"
group.stab="安定化"
group.debug="デバッグ"

# 3D
strength="3D 強度"
strength.0="0 オフ（視差なし）"
strength.1="1 控えめ"
strength.2="2 標準"
strength.3="3 強い"
strength.4="4 最大"
convergence="収束面"
convergence.desc="視差ゼロのスクリーン面。上げるほど手前に飛び出す"
swap="左右反転"
fullsbs="Full-SBS（横2倍）"
fullsbs.desc="出力を横2倍にして1眼フル解像度。OBSのベース/出力解像度も横2倍にしないと縮小されHalf相当に戻る（オフ=Half-SBS）"
sbssize="SBS サイズ"
sbssize.match="ソース基準"
sbssize.1080p="1080p（1920×1080/眼）"
sbssize.desc="片眼の出力解像度。「ソース基準」はソースの寸法のまま。「1080p」は片眼を固定1920×1080で出力（Full-SBS→3840×1080 / Half-SBS→1920×1080）し、ソースのサイズに依らずグラス向けのSBSフレームになる。OBSのキャンバス/出力解像度を同じサイズにすると1:1。"
letterbox="片眼をレターボックス（アスペクト維持）"
letterbox.desc="引き伸ばさず、アスペクト比を保って各眼にソースを収め、余白を黒帯にする。固定SBSサイズで非16:9ソースを扱うとき用。眼とソースのアスペクトが一致していれば無効。"

# 安定化
fps="深度更新レート"
fps.10="10 fps（軽）"
fps.15="15 fps"
fps.24="24 fps（映画）"
fps.30="30 fps（重）"
fps.60="60 fps（最重）"
fps.desc="深度推論のレート。下げるとGPU負荷が減る（warpは毎フレーム）"
skipstatic="静止時は推論を停止"
skipstatic.desc="フレームがほぼ静止している間はキャッシュした深度を再利用し、ONNX推論をスキップしてGPU負荷を下げる（表示は毎フレーム継続）"
staticthresh="静止判定のしきい値"
staticthresh.desc="縮小フレームの平均色差がこの値以下なら静止とみなす。0=完全一致のみ。カメラのノイズで止まらない場合は上げる"
temporal="時間安定化"
temporal.desc="フロー誘導の時間平滑で、静止領域や追従領域の深度がフレームごとに揺れるのを抑える。チェックを外すと最も生で応答の速い深度になる。"
stabstrength="安定化の強さ"
stabstrength.desc="高いほど揺れが減る／動きは僅かに遅延・残像寄り。時間安定化オフ時は無効"
edgesoft="エッジ平滑"
edgesoft.desc="深度エッジをなめらかにし、強い視差での輪郭破綻を低減。上げるほどエッジの3Dは丸くなる"
syncdelay="深度と映像を一致（映像を遅延）"
syncdelay.desc="実測した深度レイテンシ（約0.1秒）ぶん映像表示を遅らせ、\n各フレームを「そのフレーム自身から求めた深度」でwarpする。\n動き中に起きる“深度が映像から遅れる”ズレを解消する。\n直近のフルレスフレームを保持するため追加のVRAMを使い、出力に遅延が発生する。\n音声は自動で同じだけ遅らせて同期する（有効中はソースの同期オフセットを本フィルタが管理）。\nライブ配信では追加遅延は配信サイトのバッファに吸収されほぼ気にならない。\n本モードは1ソースにつき1フィルタまで（複数有効にするとソースの音声同期オフセットを共有し、最後の設定が優先される）。"

# デバンド（ノブのラベルは単独フィルタ near Real 3D Deband と共有）
debandorderwarn="「near Real 3D Deband」が本フィルタより下にあります。3D warp の前にソースをデバンドするため、「near Real 3D」より〈上〉へ移動してください（フィルタは上から順に適用）。下のままだと、warp 済みのステレオ出力をデバンドしてしまいます。（この設定を開き直すと再判定します）"
debanditer="反復回数"
debanditer.1="1（軽）"
debanditer.2="2"
debanditer.3="3"
debanditer.4="4（強）"
debanditer.desc="1 画素あたりのデバンド反復回数。回ごとに半径を広げ・しきい値を狭めて処理する。多いほどバンディングは消えるが GPU 負荷が増す。4 超は効果が乏しい。mpv --deband-iterations。"
debandthresh="しきい値"
debandthresh.desc="どの大きさの段差までをバンディングとみなして平滑化するか。高いほど強く消えるが、細部もなまり始める。mpv --deband-threshold（48=mpv 既定）。"
debandrange="範囲（半径）"
debandrange.desc="ソース画素単位の初期サンプル半径（反復ごとに拡大）。大きいほど広いグラデーションを拾うが局所的な平滑は弱まる。mpv --deband-range（16=mpv 既定）。"
debandgrain="グレイン"
debandgrain.desc="残った段差を隠すために加える静的ディザの量。高いほどバンディングは隠れるが、わずかなノイズ感が出る。mpv --deband-grain（48=mpv 既定）。"

# デバッグ
showdepth="深度マップを表示（左:深度 / 右:原画）"
showdepth.desc="左眼に深度マップ（グレースケール）、右眼に元画像を並べて表示するデバッグ。深度と原画を見比べられる。静止スキップ中は深度が固定され原画だけ更新されるので、静止判定しきい値の効きを目視で確認しやすい"
