# near Real 3D (obs-near-real3d) -- UI 文字列（日本語）

# グループ
group.3d="3D"
group.stab="安定化"
group.debug="デバッグ"

# 3D
strength="3D 強度"
strength.0="0 オフ（視差なし）"
strength.1="1 控えめ"
strength.2="2 標準"
strength.3="3 強い"
strength.4="4 最大"
strength.desc="視差（parallax）の量。\n0＝視差なし（フラット）：深度処理は走ったまま立体だけ無効\n＝A/B比較用。\n上げるほど飛び出すが、深度エッジでの輪郭破綻も増える。"
convergence="収束面"
convergence.desc="視差ゼロのスクリーン面。\n上げるほど手前に飛び出す。"
grading="立体グレーディング（S字）"
grading.desc="深度→視差の対応を直線からS字へ変える。\n近景/遠景の端点視差は保ったまま、中距離の立体感を強める。\n『3D強度』を上げるのと違い、最大視差（とその輪郭破綻）\nを上げずに中距離の奥行きを濃くできる。\n深度の順序と収束面は保たれる。0=直線（オフ）。"
silhouette="シルエット保護"
silhouette.desc="人物や物体の輪郭など、横方向の深度段差で視差を局所的に弱める。\n実際にwarpがサンプルする左右方向だけを見るため、平坦部や縦方向の細部は保ちやすい。\n強い視差で出る輪郭の裂け・背景の引き伸ばしを抑える。\n高すぎると輪郭付近の3Dが少し丸くなる。0=オフ。"
flatprotect="フラット保護"
flatprotect.desc="ソースのテクスチャが乏しい領域（黒/白のレターボックス帯・\n平坦なUIパネル・なめらかな空など）で視差をゼロへ弱める。\nそこは単眼深度が深度を捏造するだけで、warpすると枠やUIの\n直線がせん断される。本機能でそれらを画面面に貼り付けて\n（真っ直ぐに保ち）、テクスチャのある本編はフル3Dのまま。\n画像ベースなので、外周だけでなくフレーム内部の帯/マージン\nにも効く。上げると平坦な空・壁の立体感も失われる。\n主にスクリーンキャプチャ/レターボックス素材向け。0=オフ。"
swap="左右反転"
swap.desc="左右の眼を入れ替える。\n立体が反転して見える（奥行きが裏返る）ときにオン。"
autosuppress="低信頼シーンで3Dを自動的に弱める"
autosuppress.desc="深度が当てにならないシーンで3D強度を自動的に弱める。\nモデルが深度を捏造しがちな低構造シーン（空・星空・霧・\n平坦なUI）や強いカメラブレで効く。\n「外しを当てにいく」より「暴れない」ほうが体感が良い。\n信頼度は安定化のフレーム間の深度安定性から求めるため\n本トグルの子（時間安定化オフ時は無効）。\n完全な2Dには落とさない（下限あり）。\n常に一定の3D強度にしたいときはオフ。"
fullsbs="Full-SBS（横2倍）"
fullsbs.desc="出力を横2倍にして1眼フル解像度。\nOBSのベース/出力解像度も横2倍にしないと縮小され\nHalf相当に戻る（オフ=Half-SBS）。"
sbssize="SBS サイズ"
sbssize.match="ソース基準"
sbssize.1080p="1080p（1920×1080/眼）"
sbssize.desc="片眼の出力解像度。\n「ソース基準」はソースの寸法のまま。\n「1080p」は片眼を固定1920×1080で出力\n（Full-SBS→3840×1080 / Half-SBS→1920×1080）し、\nソースのサイズに依らずグラス向けのSBSフレームになる。\nOBSのキャンバス/出力解像度を同じサイズにすると1:1。"
letterbox="片眼をレターボックス（アスペクト維持）"
letterbox.desc="引き伸ばさず、アスペクト比を保って各眼にソースを収め、\n余白を黒帯にする。\n固定SBSサイズで非16:9ソースを扱うとき用。\n眼とソースのアスペクトが一致していれば無効。"
dither="出力ディザ"
dither.desc="3D出力時に加える静的ディザ。\nwarp自身の8bit再量子化が再生成するバンディング\n（暗部グラデで顕著／warpが引き伸ばす領域も）を隠す。\n三角分布(TPDF)で出力画素ごとにシードするためチラつかない。\n0=オフ。\nソースをwarp前に整える単独フィルタ\n『near Real 3D Deband』とは独立。"

# 安定化
fps="深度更新レート"
fps.10="10 fps（軽）"
fps.15="15 fps"
fps.24="24 fps（映画）"
fps.30="30 fps（重）"
fps.60="60 fps（最重）"
fps.desc="深度推論のレート。\n下げるとGPU負荷が減る（warpは毎フレーム）。"
skipstatic="静止時は推論を停止"
skipstatic.desc="フレームがほぼ静止している間はキャッシュした深度を再利用し、\nONNX推論をスキップしてGPU負荷を下げる\n（表示は毎フレーム継続）。"
staticthresh="静止判定のしきい値"
staticthresh.desc="縮小フレームの平均色差がこの値以下なら静止とみなす。\n0=完全一致のみ。\nカメラのノイズで止まらない場合は上げる。"
temporal="時間安定化"
temporal.desc="フロー誘導の時間平滑で、静止領域や追従領域の深度が\nフレームごとに揺れるのを抑える。\nチェックを外すと最も生で応答の速い深度になる。"
stabstrength="安定化の強さ"
stabstrength.desc="高いほど揺れが減る／動きは僅かに遅延・残像寄り。\n時間安定化オフ時は無効。"
edgesoft="エッジ平滑"
edgesoft.desc="深度エッジをなめらかにし、強い視差での輪郭破綻を低減。\n上げるほどエッジの3Dは丸くなる。"
syncdelay="深度と映像を一致（映像を遅延）"
syncdelay.desc="実測した深度レイテンシ（約0.1秒）ぶん映像表示を遅らせ、\n各フレームを「そのフレーム自身から求めた深度」でwarpする。\n動き中に起きる“深度が映像から遅れる”ズレを解消する。\n直近のフルレスフレームを保持するため追加のVRAMを使い、出力に遅延が発生する。\n音声は自動で同じだけ遅らせて同期する（有効中はソースの同期オフセットを本フィルタが管理）。\nライブ配信では追加遅延は配信サイトのバッファに吸収されほぼ気にならない。\n本モードは1ソースにつき1フィルタまで（複数有効にするとソースの音声同期オフセットを共有し、最後の設定が優先される）。"
delaymargin="遅延マージン（フレーム）"
delaymargin.desc="「深度と映像を一致」時のみ有効。\n実測レイテンシに上乗せする追加遅延フレーム数。\nカット後の新シーン深度が、新シーン映像が画面に出るより\n先に届くようにして、新シーン先頭での一瞬の2D（赤フラッシュ）\nを防ぎカットを3Dのまま通過させる。\n0=実測ちょうど（フラッシュし得る）／通常2で十分。\n大きいほど遅延が少し増える（音声も追従）。\nカットでまだ2Dが出るなら上げる。"

# デバンド（ノブのラベルは単独フィルタ near Real 3D Deband と共有）
debandorderwarn="「near Real 3D Deband」が本フィルタより下にあります。3D warp の前にソースをデバンドするため、「near Real 3D」より〈上〉へ移動してください（フィルタは上から順に適用）。下のままだと、warp 済みのステレオ出力をデバンドしてしまいます。（この設定を開き直すと再判定します）"
debanditer="反復回数"
debanditer.1="1（軽）"
debanditer.2="2"
debanditer.3="3"
debanditer.4="4（強）"
debanditer.desc="1画素あたりのデバンド反復回数。\n回ごとに半径を広げ・しきい値を狭めて処理する。\n多いほどバンディングは消えるがGPU負荷が増す。\n4超は効果が乏しい。mpv --deband-iterations。"
debandthresh="しきい値"
debandthresh.desc="どの大きさの段差までをバンディングとみなして平滑化するか。\n高いほど強く消えるが、細部もなまり始める。\nmpv --deband-threshold（48=mpv既定）。"
debandrange="範囲（半径）"
debandrange.desc="ソース画素単位の初期サンプル半径（反復ごとに拡大）。\n大きいほど広いグラデーションを拾うが局所的な平滑は弱まる。\nmpv --deband-range（16=mpv既定）。"
debandgrain="グレイン"
debandgrain.desc="残った段差を隠すために加える静的ディザの量。\n高いほどバンディングは隠れるが、わずかなノイズ感が出る。\nmpv --deband-grain（48=mpv既定）。"

# デバッグ
showdepth="深度マップを表示（左:深度 / 右:原画）"
showdepth.desc="左眼に深度マップ（グレースケール）、右眼に元画像を\n並べて表示するデバッグ。深度と原画を見比べられる。\n静止スキップ中は深度が固定され原画だけ更新されるので、\n静止判定しきい値の効きを目視で確認しやすい。"
debugoverlay="深度マッチ状態で着色"
debugoverlay.desc="デバッグ用オーバーレイ。\n表示フレームに一致するキャッシュ深度が無い\n（フラット=2Dフォールバック）時は赤、\n視差がランプ復帰中は黄、フル3Dでは無着色にする。\nハードカット直後の見えにくい挙動が一目で分かる。\n検出したカットと2Dフォールバック（赤）の継続msも\nOBSログに出力する。ONNX深度の稼働中のみ有効。"
debugcache1="深度キャッシュ無効（1枚・A/B）"
debugcache1.desc="デバッグA/B。深度キャッシュを実効1枚に制限し、\n旧来の『最新深度のみ』挙動を再現する。\n『深度と映像を一致』をオンにしてハードカットを、\n本項オン/オフで比較（『深度マッチ状態で着色』と併用推奨）：\nオン→カット後に旧シーンの末尾が2D（赤）に落ちる／\nオフ→3Dを維持。"
