# near Real 3D (obs-near-real3d) -- UI strings. Default / fallback locale.

# Groups
group.3d="3D"
group.stab="Stabilization"
group.debug="Debug"

# 3D
strength="3D strength"
strength.0="0  Off (no parallax)"
strength.1="1  Subtle"
strength.2="2  Standard"
strength.3="3  Strong"
strength.4="4  Max"
convergence="Convergence"
convergence.desc="Zero-parallax screen plane. Higher values push the image further toward the viewer."
swap="Swap left/right"
fullsbs="Full-SBS (2x width)"
fullsbs.desc="Output at double width, full resolution per eye. The OBS base/output resolution must also be doubled, otherwise the 2x source is scaled back down to Half-SBS. (Off = Half-SBS.)"
sbssize="SBS size"
sbssize.match="Match source"
sbssize.1080p="1080p (1920x1080 / eye)"
sbssize.desc="Per-eye output resolution. 'Match source' keeps the source size; '1080p' emits a fixed 1920x1080 per eye (Full-SBS -> 3840x1080, Half-SBS -> 1920x1080) so the SBS frame fits glasses regardless of source size. Set the OBS canvas/output to the same size for a 1:1 result."
letterbox="Letterbox each eye (keep aspect)"
letterbox.desc="Fit the source into each eye preserving aspect ratio, with black bars, instead of stretching to fill. Use for non-16:9 sources at a fixed SBS size; no effect when the eye already matches the source aspect."

# Stabilization
fps="Depth update rate"
fps.10="10 fps (light)"
fps.15="15 fps"
fps.24="24 fps (film)"
fps.30="30 fps (heavy)"
fps.60="60 fps (heaviest)"
fps.desc="Depth inference rate. Lower it to reduce GPU load (the warp still runs every frame)."
skipstatic="Stop inference when static"
skipstatic.desc="While the frame is nearly static, reuse the cached depth and skip ONNX inference to cut GPU load (display/warp keeps running every frame)."
staticthresh="Static threshold"
staticthresh.desc="Treated as static when the downscaled frame's mean color difference is at or below this. 0 = exact match only; raise it if camera noise prevents skipping."
temporal="Stabilize depth (temporal)"
temporal.desc="Flow-guided temporal smoothing of the depth map so static and tracked regions don't wobble frame to frame. Turn off (uncheck) for the rawest, most responsive depth."
stabstrength="Stabilization strength"
stabstrength.desc="Higher = steadier, with slightly delayed motion and a bit more ghosting. No effect when temporal stabilization is off."
edgesoft="Edge softening"
edgesoft.desc="Smooths depth edges to reduce silhouette tearing at strong parallax. Higher rounds off the 3D at edges."
syncdelay="Frame-matched depth (delay video to align)"
syncdelay.desc="Delays the displayed video by the measured depth latency (~0.1 s)\nso each frame is warped by depth from that same frame, removing the\ndepth-lags-image misalignment during motion.\nCosts extra VRAM (buffers recent full-res frames) and adds output latency.\nAudio is delayed to match automatically (the source's sync offset is\nmanaged while enabled).\nFor live streaming the added delay is usually hidden by the platform buffer.\nUse on at most one filter per source: multiple delay-mode filters share the source's single audio sync offset, so the last one wins."

# Debanding -- knob labels shared with the standalone 'near Real 3D Deband' filter.
debandorderwarn="'near Real 3D Deband' is below this filter. Move it ABOVE 'near Real 3D' so it debands the source before the 3D warp (filters apply top to bottom). Left below, it debands the already-warped stereo output instead. (Re-open this panel to refresh.)"
debanditer="Iterations"
debanditer.1="1 (light)"
debanditer.2="2"
debanditer.3="3"
debanditer.4="4 (strong)"
debanditer.desc="Debanding passes per pixel; each pass looks over a larger radius with a tighter threshold. More removes more banding but costs more GPU -- above 4 is rarely worth it. mpv --deband-iterations."
debandthresh="Threshold"
debandthresh.desc="How large a step still counts as banding (and gets smoothed). Higher erases more banding but starts to wash out fine detail. mpv --deband-threshold (48 = mpv default)."
debandrange="Range (radius)"
debandrange.desc="Initial sample radius in source pixels, growing each iteration. Larger finds wider gradients but smooths less locally. mpv --deband-range (16 = mpv default)."
debandgrain="Grain"
debandgrain.desc="Amount of static dither added to hide any residual step. Higher covers more banding at the cost of a faint noise texture. mpv --deband-grain (48 = mpv default)."

# Debug
showdepth="Show depth map (L: depth / R: source)"
showdepth.desc="Debug view: left eye = depth map (grayscale), right eye = source image, side by side. While static-skip is active the depth freezes and only the source keeps updating - handy for tuning the static threshold."
