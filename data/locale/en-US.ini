# near Real 3D (obs-near-real3d) -- UI strings. Default / fallback locale.

# Groups
group.3d="3D"
group.stab="Stabilization"
group.debug="Debug"

# 3D
strength="3D strength"
strength.0="0  Off (no parallax)"
strength.1="1  Subtle"
strength.2="2  Standard"
strength.3="3  Strong"
strength.4="4  Max"
strength.desc="Disparity (parallax) amount.\n0 = no parallax (flat): depth still runs, only the stereo\nis disabled -- for A/B comparison.\nHigher = stronger pop-out, but more silhouette tearing at\nsharp depth edges."
convergence="Convergence"
convergence.desc="Zero-parallax screen plane.\nHigher values push the image further toward the viewer."
grading="Depth curve (S-curve)"
grading.desc="Reshapes depth-to-disparity from a straight line toward\nan S-curve: more stereo through the mid-range while keeping\nthe near/far endpoint disparities unchanged.\nLets you get richer mid-scene depth without raising the\nmaximum disparity (and its silhouette tearing) like\n'3D strength' would.\nDepth order and the convergence plane are preserved.\n0 = linear (off)."
silhouette="Silhouette protection"
silhouette.desc="Locally eases disparity at horizontal depth jumps such as\nobject or person outlines.\nIt only checks the left/right direction the warp actually samples,\nso flat regions and vertical detail are mostly left alone.\nReduces edge tearing and background stretching at strong parallax.\nToo high can slightly round off 3D near silhouettes. 0 = off."
swap="Swap left/right"
swap.desc="Flip the left/right eyes.\nTurn on if the stereo looks inverted (depth reads\ninside-out) on your display or glasses."
autosuppress="Auto-ease 3D in low-confidence scenes"
autosuppress.desc="Eases the 3D strength down when the depth is unreliable:\nlow-structure scenes the model fabricates depth for\n(sky, starfield, fog, flat UI) or strong camera shake,\nwhere 'don't thrash' looks better than guessing.\nDerived from the stabiliser's frame-to-frame depth\nstability, hence nested here (it does nothing while\ntemporal stabilization is off).\nNever flattens fully -- it floors at a fraction.\nTurn off for a constant 3D strength."
fullsbs="Full-SBS (2x width)"
fullsbs.desc="Output at double width, full resolution per eye.\nThe OBS base/output resolution must also be doubled,\notherwise the 2x source is scaled back down to Half-SBS.\n(Off = Half-SBS.)"
sbssize="SBS size"
sbssize.match="Match source"
sbssize.1080p="1080p (1920x1080 / eye)"
sbssize.desc="Per-eye output resolution.\n'Match source' keeps the source size; '1080p' emits a\nfixed 1920x1080 per eye (Full-SBS -> 3840x1080,\nHalf-SBS -> 1920x1080) so the SBS frame fits glasses\nregardless of source size.\nSet the OBS canvas/output to the same size for 1:1."
letterbox="Letterbox each eye (keep aspect)"
letterbox.desc="Fit the source into each eye preserving aspect ratio,\nwith black bars, instead of stretching to fill.\nUse for non-16:9 sources at a fixed SBS size; no effect\nwhen the eye already matches the source aspect."
dither="Output dither"
dither.desc="Static dither added at the 3D output to mask the banding\nthe warp's own 8-bit re-quantization would otherwise\nre-create (worst in dark gradients, which the warp also\nstretches). Triangular-PDF, seeded per output pixel so it\ndoesn't shimmer. 0 = off.\nIndependent of the standalone 'near Real 3D Deband'\nfilter, which cleans the source before the warp."

# Stabilization
fps="Depth update rate"
fps.10="10 fps (light)"
fps.15="15 fps"
fps.24="24 fps (film)"
fps.30="30 fps (heavy)"
fps.60="60 fps (heaviest)"
fps.desc="Depth inference rate. Lower it to reduce GPU load\n(the warp still runs every frame)."
skipstatic="Stop inference when static"
skipstatic.desc="While the frame is nearly static, reuse the cached depth\nand skip ONNX inference to cut GPU load\n(display/warp keeps running every frame)."
staticthresh="Static threshold"
staticthresh.desc="Treated as static when the downscaled frame's mean color\ndifference is at or below this.\n0 = exact match only; raise it if camera noise prevents\nskipping."
temporal="Stabilize depth (temporal)"
temporal.desc="Flow-guided temporal smoothing of the depth map so static\nand tracked regions don't wobble frame to frame.\nTurn off (uncheck) for the rawest, most responsive depth."
stabstrength="Stabilization strength"
stabstrength.desc="Higher = steadier, with slightly delayed motion and a bit\nmore ghosting.\nNo effect when temporal stabilization is off."
edgesoft="Edge softening"
edgesoft.desc="Smooths depth edges to reduce silhouette tearing at strong\nparallax. Higher rounds off the 3D at edges."
syncdelay="Frame-matched depth (delay video to align)"
syncdelay.desc="Delays the displayed video by the measured depth latency (~0.1 s)\nso each frame is warped by depth from that same frame, removing the\ndepth-lags-image misalignment during motion.\nCosts extra VRAM (buffers recent full-res frames) and adds output latency.\nAudio is delayed to match automatically (the source's sync offset is\nmanaged while enabled).\nFor live streaming the added delay is usually hidden by the platform buffer.\nUse on at most one filter per source: multiple delay-mode filters share the source's single audio sync offset, so the last one wins."
delaymargin="Delay margin (frames)"
delaymargin.desc="Frame-matched depth only.\nExtra frames of delay beyond the measured latency so the\npost-cut depth lands before the new scene's frames reach\nthe screen, keeping a hard cut in 3D instead of a brief\n2D flash on the new scene's leading edge.\n0 = exact latency (may flash); 2 is usually enough.\nHigher adds a little more latency (audio follows).\nRaise it if cuts still flash 2D."

# Debanding -- knob labels shared with the standalone 'near Real 3D Deband' filter.
debandorderwarn="'near Real 3D Deband' is below this filter. Move it ABOVE 'near Real 3D' so it debands the source before the 3D warp (filters apply top to bottom). Left below, it debands the already-warped stereo output instead. (Re-open this panel to refresh.)"
debanditer="Iterations"
debanditer.1="1 (light)"
debanditer.2="2"
debanditer.3="3"
debanditer.4="4 (strong)"
debanditer.desc="Debanding passes per pixel; each pass looks over a larger\nradius with a tighter threshold.\nMore removes more banding but costs more GPU -- above 4\nis rarely worth it. mpv --deband-iterations."
debandthresh="Threshold"
debandthresh.desc="How large a step still counts as banding (and gets\nsmoothed). Higher erases more banding but starts to wash\nout fine detail.\nmpv --deband-threshold (48 = mpv default)."
debandrange="Range (radius)"
debandrange.desc="Initial sample radius in source pixels, growing each\niteration. Larger finds wider gradients but smooths less\nlocally. mpv --deband-range (16 = mpv default)."
debandgrain="Grain"
debandgrain.desc="Amount of static dither added to hide any residual step.\nHigher covers more banding at the cost of a faint noise\ntexture. mpv --deband-grain (48 = mpv default)."

# Debug
showdepth="Show depth map (L: depth / R: source)"
showdepth.desc="Debug view: left eye = depth map (grayscale), right eye =\nsource image, side by side.\nWhile static-skip is active the depth freezes and only the\nsource keeps updating - handy for tuning the static\nthreshold."
debugoverlay="Tint by depth-match state"
debugoverlay.desc="Debug overlay: tints the output red when the shown frame\nhas no matching cached depth (warping flat / 2D fallback),\nyellow while the disparity is ramping back, and leaves it\nuntinted at full 3D.\nMakes the otherwise-invisible behaviour right after a hard\ncut visible at a glance. Also logs each detected cut and\nthe 2D-fallback (red) duration to the OBS log.\nOnly active while ONNX depth is running."
debugcache1="Disable depth cache (1 slot, A/B)"
debugcache1.desc="Debug A/B: limits the depth cache to a single live slot,\nreproducing the old 'latest depth only' behaviour.\nWith frame-matched depth on, compare a hard cut with this\non vs off (pair with 'Tint by depth-match state'):\non -> the prior scene's tail drops to 2D (red) after the\ncut; off -> it keeps its 3D."
