# near Real 3D (obs-near-real3d) -- UI 字符串（简体中文）

# 分组
group.3d="3D"
group.stab="稳定化"
group.debug="调试"

# 3D
strength="3D 强度"
strength.0="0 关闭（无视差）"
strength.1="1 轻微"
strength.2="2 标准"
strength.3="3 强"
strength.4="4 最大"
strength.desc="视差（parallax）的大小。\n0＝无视差（平面）：深度处理仍运行，仅关闭立体\n＝用于 A/B 对比。\n越大越突出，但深度边缘的轮廓撕裂也越多。"
convergence="会聚面"
convergence.desc="视差为零的屏幕平面。\n越大越向前突出。"
grading="深度曲线（S 曲线）"
grading.desc="将深度→视差的映射由直线改为 S 曲线。\n保持近景/远景端点视差不变，同时增强中景立体感。\n与提高“3D 强度”不同，可在不增大最大视差\n（及其轮廓撕裂）的前提下加深中景纵深。\n深度顺序与会聚面保持不变。0=直线（关闭）。"
silhouette="轮廓保护"
silhouette.desc="在人物或物体边缘等横向深度突变处，局部减弱视差。\n仅检查 warp 实际采样的左右方向，因此较能保留平坦区域和纵向细节。\n可减少强视差下的边缘撕裂与背景拉伸。\n过高会让轮廓附近的 3D 稍微变圆。0=关闭。"
swap="左右交换"
swap.desc="交换左右眼。\n当立体显示反转（纵深里外颠倒）时开启。"
autosuppress="低置信场景自动减弱 3D"
autosuppress.desc="在深度不可靠的场景自动减弱 3D 强度。\n对模型容易臆造深度的低结构场景（天空、星空、雾、\n平坦 UI）或强烈镜头抖动有效。\n“暴露错误”不如“保持稳定”观感更好。\n置信度取自稳定化的逐帧深度稳定性，故为本开关的子项\n（时间稳定化关闭时无效）。\n不会完全压成 2D（有下限）。\n想保持恒定 3D 强度时请关闭。"
fullsbs="Full-SBS（双倍宽）"
fullsbs.desc="输出横向加倍，每眼全分辨率。\nOBS 的基准/输出分辨率也需横向加倍，否则会被缩小\n退回 Half 效果（关闭＝Half-SBS）。"
sbssize="SBS 尺寸"
sbssize.match="跟随源"
sbssize.1080p="1080p（1920×1080/眼）"
sbssize.desc="每眼的输出分辨率。\n“跟随源”保持源的尺寸。\n“1080p”将每眼固定为 1920×1080 输出\n（Full-SBS→3840×1080 / Half-SBS→1920×1080），\n无论源尺寸如何都生成适配眼镜的 SBS 画面。\n将 OBS 画布/输出设为同一尺寸即可 1:1。"
letterbox="每眼信箱化（保持宽高比）"
letterbox.desc="不拉伸，按宽高比将源放入每只眼，\n余白填充黑边。\n用于在固定 SBS 尺寸下处理非 16:9 的源。\n当眼与源的宽高比一致时无效。"
dither="输出抖动"
dither.desc="3D 输出时加入的静态抖动。\n用于掩盖 warp 自身 8bit 再量化重新产生的条带\n（暗部渐变尤其明显／warp 拉伸的区域也是）。\n按输出像素播种的三角分布(TPDF)，因此不会闪烁。\n0=关闭。\n与在 warp 前整理源的独立滤镜\n“near Real 3D Deband”相互独立。"

# 稳定化
fps="深度更新率"
fps.10="10 fps（轻）"
fps.15="15 fps"
fps.24="24 fps（电影）"
fps.30="30 fps（重）"
fps.60="60 fps（最重）"
fps.desc="深度推理的频率。\n调低可减少 GPU 负载（warp 仍每帧运行）。"
skipstatic="静止时停止推理"
skipstatic.desc="当画面几乎静止时复用缓存的深度，\n跳过 ONNX 推理以降低 GPU 负载\n（显示/warp 仍每帧继续）。"
staticthresh="静止判定阈值"
staticthresh.desc="缩小后画面的平均色差不超过此值即视为静止。\n0=仅完全一致。\n若因相机噪点无法判定为静止则调高。"
temporal="时间稳定化"
temporal.desc="用光流引导的时间平滑，抑制静止区域与跟随区域的\n深度逐帧抖动。\n取消勾选可获得最原始、响应最快的深度。"
stabstrength="稳定化强度"
stabstrength.desc="越高越稳定／运动会略有延迟、稍偏残影。\n时间稳定化关闭时无效。"
edgesoft="边缘柔化"
edgesoft.desc="柔化深度边缘，减少强视差下的轮廓撕裂。\n越高边缘处的 3D 越被磨圆。"
syncdelay="深度与画面对齐（延迟画面）"
syncdelay.desc="将画面显示延迟实测的深度延迟（约 0.1 秒），\n使每帧都用“该帧自身求得的深度”进行 warp。\n消除运动中出现的“深度落后于画面”的错位。\n为保留最近的全分辨率帧会占用额外 VRAM，并使输出产生延迟。\n音频会自动延迟相同时长以保持同步（启用期间由本滤镜管理源的同步偏移）。\n直播时额外延迟通常会被平台缓冲吸收，几乎无感。\n本模式每个源最多用于一个滤镜（启用多个会共享源的音频同步偏移，以最后设置为准）。"
delaymargin="延迟余量（帧）"
delaymargin.desc="仅在“深度与画面对齐”时有效。\n在实测延迟之上额外增加的延迟帧数。\n使切换后的新场景深度先于新场景画面到达屏幕，\n防止新场景开头出现瞬间的 2D（红色闪烁），\n让切换保持 3D 通过。\n0=正好等于实测（可能闪烁）／通常 2 即可。\n越大延迟略增（音频同步跟随）。\n若切换仍出现 2D 则调高。"

# 去色带（旋钮标签与独立滤镜 near Real 3D Deband 共用）
debandorderwarn="“near Real 3D Deband”位于本滤镜下方。为在 3D warp 之前对源去色带，请将其移动到“near Real 3D”上方（滤镜自上而下依次应用）。若留在下方，将对已 warp 的立体输出去色带。（重新打开此设置面板会再次判定）"
debanditer="迭代次数"
debanditer.1="1（轻）"
debanditer.2="2"
debanditer.3="3"
debanditer.4="4（强）"
debanditer.desc="每像素的去色带迭代次数。\n每次迭代扩大半径、收紧阈值进行处理。\n越多越能消除色带，但 GPU 负载增加。\n超过 4 收益甚微。mpv --deband-iterations。"
debandthresh="阈值"
debandthresh.desc="多大的台阶仍算作色带并被平滑。\n越高消除越强，但细节也开始变钝。\nmpv --deband-threshold（48=mpv 默认）。"
debandrange="范围（半径）"
debandrange.desc="以源像素为单位的初始采样半径（每次迭代扩大）。\n越大越能覆盖宽渐变，但局部平滑变弱。\nmpv --deband-range（16=mpv 默认）。"
debandgrain="颗粒"
debandgrain.desc="为掩盖残余台阶而加入的静态抖动量。\n越高越能掩盖色带，但会出现轻微噪点感。\nmpv --deband-grain（48=mpv 默认）。"

# 调试
showdepth="显示深度图（左:深度 / 右:原图）"
showdepth.desc="调试视图：左眼显示深度图（灰度），右眼显示原图，\n并排对照。可比较深度与原画。\n静止跳过期间深度被冻结、仅原图更新，\n便于目视确认静止判定阈值的效果。"
debugoverlay="按深度匹配状态着色"
debugoverlay.desc="调试用叠加。\n当显示帧没有匹配的缓存深度\n（平面=2D 回退）时显示红色，\n视差正在斜坡恢复时为黄色，完整 3D 时不着色。\n可一眼看出硬切换后难以察觉的行为。\n还会把检测到的切换与 2D 回退（红）的持续 ms\n输出到 OBS 日志。仅在 ONNX 深度运行时有效。"
debugcache1="禁用深度缓存（1 张・A/B）"
debugcache1.desc="调试 A/B。将深度缓存限制为实际 1 张，\n重现旧的“仅最新深度”行为。\n开启“深度与画面对齐”后，用本项开/关对比硬切换\n（建议与“按深度匹配状态着色”并用）：\n开→切换后旧场景的尾部落为 2D（红）／\n关→保持 3D。"
