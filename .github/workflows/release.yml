name: release

# Push a tag like v0.2.0 to build + publish a release. (Manual runs build the
# artifacts but don't publish.) The baked-in version comes from the tag
# unchanged (v0.2.0 -> v0.2.0); for manual runs it falls back to
# 0.3.<run_number>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $tag = $env:REF_NAME
          if ($tag -match '^v\d+\.\d+\.\d+.*$') { $v = $tag }
          else { $v = "0.3.$env:RUN_NUMBER" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Setup MSVC (cl / lib / dumpbin on PATH)
        # Done in-line (vcvars -> $GITHUB_ENV) instead of a Node-based action so
        # the workflow has no Node.js-20 dependency to break on Node 24.
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          $before = @{}
          foreach ($e in Get-ChildItem Env:) { $before[$e.Name] = $e.Value }
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $n = $Matches[1]; $v = $Matches[2]
              if ($before[$n] -ne $v) { "$n=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }
          Write-Host "MSVC environment configured from $vcvars"

      - name: Install Ninja + OBS Studio
        run: |
          choco install ninja --no-progress -y
          # OBS provides obs.dll, used for the import lib + to pin the headers.
          choco install obs-studio --no-progress -y --version=32.1.2

      - name: Fetch libobs headers (matching the installed OBS)
        run: |
          $pv = (Get-Item "C:\Program Files\obs-studio\bin\64bit\obs.dll").VersionInfo.ProductVersion
          $obsVer = if ($pv -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { "32.1.2" }
          git clone --depth 1 --branch $obsVer --single-branch `
            https://github.com/obsproject/obs-studio.git deps/obs-studio

      - name: Generate obs.lib from obs.dll
        run: |
          $dll = "C:\Program Files\obs-studio\bin\64bit\obs.dll"
          New-Item -ItemType Directory -Force deps/obslib | Out-Null
          dumpbin /exports $dll > exports.txt
          $names = foreach ($l in Get-Content exports.txt) {
            if ($l -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') { $Matches[1] }
          }
          $names = $names | Where-Object { $_ -and $_ -ne '=' } | Sort-Object -Unique
          @("EXPORTS") + $names | Set-Content deps/obslib/obs.def -Encoding ascii
          lib /def:deps/obslib/obs.def /out:deps/obslib/obs.lib /machine:x64 /nologo

      - name: Fetch ONNX Runtime (DirectML)
        run: ./deps/get_onnxruntime.ps1

      - name: Download depth model
        env:
          MODEL_URL: ${{ vars.MODEL_URL }}
          MODEL_SHA256: ${{ vars.MODEL_SHA256 }}
          MODEL_LITE_URL: ${{ vars.MODEL_LITE_URL }}
          MODEL_LITE_SHA256: ${{ vars.MODEL_LITE_SHA256 }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if (-not $env:MODEL_URL) {
            throw "Set the repository variable MODEL_URL to a direct download link for depth_anything_v2_small.onnx (Settings > Secrets and variables > Actions > Variables)."
          }
          # A published (tag) release must verify the externally hosted model.
          if (($env:IS_TAG -eq 'true') -and (-not $env:MODEL_SHA256)) {
            throw "Tag releases require the repository variable MODEL_SHA256 to verify the downloaded model. Set it (Settings > Secrets and variables > Actions > Variables)."
          }
          New-Item -ItemType Directory -Force models | Out-Null
          $mdl = "models/depth_anything_v2_small.onnx"
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $mdl
          if ($env:MODEL_SHA256) {
            $got = (Get-FileHash $mdl -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $env:MODEL_SHA256.ToLower()) {
              throw "model SHA-256 mismatch: got $got, expected $($env:MODEL_SHA256)"
            }
            Write-Host "model SHA-256 verified"
          } else {
            Write-Warning "MODEL_SHA256 not set - skipping model integrity check (non-tag build)"
          }
          # Lightweight (392x224) model for the -lite variant. Optional: when
          # MODEL_LITE_URL is unset the lite package is simply skipped, so the full
          # release still builds. When set on a tag it must also be verified.
          if ($env:MODEL_LITE_URL) {
            if (($env:IS_TAG -eq 'true') -and (-not $env:MODEL_LITE_SHA256)) {
              throw "Tag releases with MODEL_LITE_URL require MODEL_LITE_SHA256 to verify the lite model."
            }
            $lite = "models/dav2_392x224.onnx"
            Invoke-WebRequest -Uri $env:MODEL_LITE_URL -OutFile $lite
            if ($env:MODEL_LITE_SHA256) {
              $got = (Get-FileHash $lite -Algorithm SHA256).Hash.ToLower()
              if ($got -ne $env:MODEL_LITE_SHA256.ToLower()) {
                throw "lite model SHA-256 mismatch: got $got, expected $($env:MODEL_LITE_SHA256)"
              }
              Write-Host "lite model SHA-256 verified"
            } else {
              Write-Warning "MODEL_LITE_SHA256 not set - skipping lite model integrity check (non-tag build)"
            }
          } else {
            Write-Warning "MODEL_LITE_URL not set - the -lite variant will be skipped"
          }

      - name: Configure + build
        env:
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            "-DPLUGIN_VERSION=$env:PLUGIN_VERSION"
          cmake --build build

      - name: Package (zip + installer)
        env:
          PLUGIN_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./package.ps1 -Version $env:PLUGIN_VERSION -Variant full
          # Lite variant only when its model was fetched above (MODEL_LITE_URL set).
          if (Test-Path "models/dav2_392x224.onnx") {
            ./package.ps1 -Version $env:PLUGIN_VERSION -Variant lite
          } else {
            Write-Warning "models/dav2_392x224.onnx absent -> skipping lite package"
          }

      - name: Upload artifacts (every run)
        uses: actions/upload-artifact@v7
        with:
          name: near-real3d-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: near Real 3D ${{ steps.ver.outputs.version }}
          files: |
            dist/*.zip
            dist/*installer.exe
          generate_release_notes: true
